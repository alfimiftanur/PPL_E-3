openapi: 3.0.3
info:
  title: E-3 Execution Readiness API
  version: 0.2.0
  description: >
    Kontrak API kelompok E-3 (Analisis, Baseline, dan Perencanaan Proyek), ERP PT. Anaheim Nimbus Universal.
    Operasi untuk konsumen E-4 (API-K-E3-01): membaca kesiapan eksekusi proyek dari status MoM kickoff. Operasi untuk E-5 dan D-3 (API-K-E3-02): membaca ID baseline yang disetujui dan ID project plan, kebutuhan konsumen masih perlu dikonfirmasi.
    Semua ID, path, dan format masih usulan E-3 sampai dikonfirmasi pemilik layanan (lihat dokumen 04).
    Seluruh contoh adalah data fiktif.
  contact:
    name: Kelompok E-3
servers:
  - url: http://localhost:8000
    description: Server contoh Laravel (php artisan serve, port 8000). Alamat layanan sungguhan belum ada.
  - url: http://localhost:4010
    description: Mock Prism (npx @stoplight/prism-cli mock openapi.yaml -p 4010).
tags:
  - name: execution-readiness
    description: Kesiapan eksekusi proyek (FTR-K-E3-10)
  - name: planning-references
    description: Rujukan baseline dan project plan untuk E-5 dan D-3 (FTR-K-E3-04, FTR-K-E3-05)
paths:
  /api/v1/projects/{projectId}/execution-readiness:
    get:
      operationId: getExecutionReadiness
      tags: [execution-readiness]
      summary: Baca kesiapan eksekusi proyek (API-K-E3-01)
      description: >
        Mengembalikan status MoM kickoff aktif proyek dan penanda readyForExecution.
        readyForExecution bernilai true hanya bila status MoM adalah COMPLETED.
        Bila kickoff atau MoM belum ada, respons tetap 200 dengan readyForExecution false dan field terkait null.
        Operasi hanya membaca dan tidak mengubah status proyek D-1.
        Nama peserta, lampiran MoM, bukti persetujuan, dan token tidak pernah dikirim.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7). E-3 tidak membentuk ulang ID ini.
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Proyek dikenal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReadiness'
              examples:
                siap:
                  summary: MoM selesai (examples/success.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                    kickoffId: '101'
                    momId: '201'
                    status: COMPLETED
                    completedAt: '2026-10-16T11:00:00+07:00'
                    readyForExecution: true
                belumSiap:
                  summary: MoM belum selesai (examples/success-not-ready.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                    kickoffId: '101'
                    momId: '201'
                    status: IN_PROGRESS
                    completedAt: null
                    readyForExecution: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /api/v1/projects/{projectId}/planning-references:
    get:
      operationId: getPlanningReferences
      tags: [planning-references]
      summary: Baca rujukan baseline dan project plan proyek (API-K-E3-02)
      description: >
        Mengembalikan ID baseline versi disetujui terbaru dan ID project plan suatu proyek, hanya sebagai rujukan.
        Baseline berstatus DRAFT tidak pernah ditampilkan. Bila belum ada baseline disetujui atau project plan,
        respons tetap 200 dengan field terkait null. Isi matriks, estimasi jam, dan resource matrix tidak dikirim.
        Operasi hanya membaca. Konsumen dan kebutuhan datanya masih usulan E-3 sampai dikonfirmasi E-5 dan D-3.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7). E-3 tidak membentuk ulang ID ini.
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Proyek dikenal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningReferences'
              examples:
                lengkap:
                  summary: Baseline APPROVED dan project plan ada (examples/planning-references.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                    baselineId: '301'
                    baselineVersion: 1
                    approvedAt: '2026-10-14T10:00:00+07:00'
                    planId: '401'
                kosong:
                  summary: Belum ada baseline APPROVED dan project plan (examples/planning-references-empty.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234568
                    baselineId: null
                    baselineVersion: null
                    approvedAt: null
                    planId: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Usulan: Bearer token layanan konsumen (E-4, E-5, D-3) yang divalidasi F-1. Mekanisme final perlu dikonfirmasi F-1.
        Contoh token mock saja, bukan kredensial riil.
  schemas:
    ExecutionReadiness:
      type: object
      required: [projectId, kickoffId, momId, status, completedAt, readyForExecution]
      properties:
        projectId:
          type: string
          description: ID proyek kanonis D-1, sama dengan path.
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        kickoffId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID kickoff E-3 (ENT-K-E3-07), string angka. Null bila kickoff belum ada.
          example: '101'
        momId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID MoM kickoff E-3 (ENT-K-E3-08), string angka. Null bila belum ada MoM.
          example: '201'
        status:
          type: string
          nullable: true
          enum: [IN_PROGRESS, COMPLETED, null]
          description: Status MoM kickoff. Null bila belum ada MoM.
          example: COMPLETED
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu MoM selesai, ISO 8601 dengan offset WIB (+07:00), sama dengan format D-1. Terisi hanya bila status COMPLETED.
          example: '2026-10-16T11:00:00+07:00'
        readyForExecution:
          type: boolean
          description: true hanya bila status adalah COMPLETED. Selain itu false.
          example: true
    PlanningReferences:
      type: object
      required: [projectId, baselineId, baselineVersion, approvedAt, planId]
      properties:
        projectId:
          type: string
          description: ID proyek kanonis D-1, sama dengan path.
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        baselineId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID baseline versi disetujui terbaru (ENT-K-E3-02), string angka. Null bila belum ada baseline disetujui.
          example: '301'
        baselineVersion:
          type: integer
          nullable: true
          minimum: 1
          description: Nomor versi baseline tersebut. Null bila baselineId null.
          example: 1
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu baseline disetujui, ISO 8601 dengan offset WIB (+07:00), sama dengan format D-1. Null bila baselineId null.
          example: '2026-10-14T10:00:00+07:00'
        planId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID project plan (ENT-K-E3-03), string angka. Null bila project plan belum dibuat.
          example: '401'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, PROJECT_NOT_FOUND, INVALID_PROJECT_ID_FORMAT, DEPENDENCY_UNAVAILABLE]
        message:
          type: string
        details:
          type: array
          items:
            type: string
  responses:
    Unauthenticated:
      description: Token tidak ada atau tidak valid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Token tidak ada atau tidak valid.}
    Forbidden:
      description: Layanan pemanggil tidak berizin pada proyek ini.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: FORBIDDEN, message: Layanan tidak berizin pada proyek ini.}
    NotFound:
      description: ID proyek tidak dikenal.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: PROJECT_NOT_FOUND, message: Proyek tidak ditemukan.}
    InvalidRequest:
      description: Format projectId salah (bukan UUID v7).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: INVALID_PROJECT_ID_FORMAT, message: Format projectId tidak valid., details: [projectId harus berformat UUID v7]}
    DependencyUnavailable:
      description: Validasi ke F-1 atau D-1 gagal. E-4 tidak boleh menganggapnya sebagai izin eksekusi.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: DEPENDENCY_UNAVAILABLE, message: Validasi dependensi gagal. Coba lagi.}
