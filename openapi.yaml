openapi: 3.0.3
info:
  title: E-3 Planning and Execution Readiness API
  version: 0.3.0
  description: >
    Kontrak API kelompok E-3 (Analisis, Baseline, dan Perencanaan Proyek), ERP PT. Anaheim Nimbus Universal.
    Versi 0.3.0 menambahkan daftar rincian item baseline (baselineItems: baselineItemId, name, type: SCOPE/TIMELINE)
    dan target progres kumulatif rencana (targetProgress: date, progress) pada API-K-E3-02 atas permintaan modul tata kelola E-5.
    Memuat pula spesifikasi kesiapan eksekusi (E-4, API-K-E3-01), operasi Analisis Awal Proyek (POST & DELETE initial-analysis),
    dan endpoint Ringkasan State (GET overview). Seluruh contoh adalah data fiktif.
  contact:
    name: Kelompok E-3
servers:
  - url: http://localhost:8000
    description: Server contoh Laravel (php artisan serve, port 8000). Alamat layanan sungguhan belum ada.
  - url: http://localhost:4010
    description: Mock Prism (npx @stoplight/prism-cli mock openapi.yaml -p 4010).
tags:
  - name: initial-analysis
    description: Pencatatan dan Pengelolaan Analisis Awal Proyek (FTR-K-E3-01, ENT-K-E3-01)
  - name: project-overview
    description: Ringkasan State Perencanaan Proyek (/projects/overview)
  - name: execution-readiness
    description: Kesiapan eksekusi proyek untuk konsumen E-4 (FTR-K-E3-10, API-K-E3-01)
  - name: planning-references
    description: Rujukan baseline dan project plan untuk E-5 dan D-3 (FTR-K-E3-04, FTR-K-E3-05, API-K-E3-02)
paths:
  /api/v1/projects/{projectId}/initial-analysis:
    post:
      operationId: saveInitialAnalysis
      tags: [initial-analysis]
      summary: Simpan atau perbarui analisis awal proyek (Buat / Ubah)
      description: >
        Menyimpan atau memperbarui kebutuhan awal dan kondisi awal proyek (ENT-K-E3-01).
        Bila data belum ada, mencatat analisis baru (Buat, B-01).
        Bila data sudah ada, memperbarui kondisi tanpa mengubah analysisId, projectId, createdBy, dan createdAt (Ubah, B-03).
        Validasi menolak field yang kosong dengan kode 422 VALIDATION_ERROR (B-06).
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7).
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialAnalysisInput'
            examples:
              buat:
                summary: Contoh Buat (B-01)
                value:
                  projectNeed: Digitalisasi pengelolaan pengadaan dan persediaan barang
                  projectCondition: Pencatatan pengadaan dan stok masih manual pada spreadsheet terpisah
              ubah:
                summary: Contoh Ubah (B-03)
                value:
                  projectNeed: Digitalisasi pengelolaan pengadaan dan persediaan barang
                  projectCondition: Pencatatan pengadaan dan stok masih manual; laporan bulanan sering terlambat
      responses:
        '200':
          description: Analisis awal berhasil disimpan atau diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialAnalysisResponse'
              examples:
                tersimpan:
                  summary: Respons Berhasil Disimpan (B-01 / B-03 / B-05)
                  value:
                    message: Analisis awal tersimpan.
                    initialAnalysis:
                      analysisId: '1'
                      projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                      projectNeed: Digitalisasi pengelolaan pengadaan dan persediaan barang
                      projectCondition: Pencatatan pengadaan dan stok masih manual; laporan bulanan sering terlambat
                      status: Tersimpan
                      isSaved: true
                      createdBy: 01924b1e-7f32-7c40-8a01-9c0010100101
                      createdAt: '2026-10-26 22:02:53 WIB'
                      updatedBy: 01924b1e-7f32-7c40-8a01-9c0010100101
                      updatedAt: '2026-10-26 22:06:59 WIB'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: clearInitialAnalysis
      tags: [initial-analysis]
      summary: Kosongkan formulir analisis awal proyek
      description: >
        Mengosongkan isian kebutuhan dan kondisi awal proyek. Status berubah menjadi 'Belum dicatat' dan isSaved bernilai false.
        Atribut projectId tetap dipertahankan menunjuk ke proyek aktif.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7).
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Formulir analisis awal dikosongkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialAnalysisResponse'
              example:
                message: Formulir analisis awal dikosongkan.
                initialAnalysis:
                  analysisId: '1'
                  projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                  projectNeed: ''
                  projectCondition: ''
                  status: Belum dicatat
                  isSaved: false
                  createdBy: null
                  createdAt: null
                  updatedBy: null
                  updatedAt: null
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/overview:
    get:
      operationId: getProjectOverview
      tags: [project-overview]
      summary: Baca ringkasan lengkap data dan workflow proyek (B-02, B-04, B-07)
      description: >
        Mengembalikan ringkasan lengkap seluruh state perencanaan proyek mencakup informasi proyek kanonis D-1,
        analisis awal proyek E-3, draf/status baseline, tanggal rencana, rujukan planning-references, dan kesiapan eksekusi.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7).
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Data ringkasan proyek berhasil dibaca.
          content:
            application/json:
              schema:
                type: object
                required: [state, planningReferences, executionReadiness]
                properties:
                  state:
                    type: object
                    description: Seluruh state alur perencanaan proyek.
                  planningReferences:
                    $ref: '#/components/schemas/PlanningReferences'
                  executionReadiness:
                    $ref: '#/components/schemas/ExecutionReadiness'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/execution-readiness:
    get:
      operationId: getExecutionReadiness
      tags: [execution-readiness]
      summary: Baca kesiapan eksekusi proyek (API-K-E3-01)
      description: >
        Mengembalikan status MoM kickoff aktif proyek dan penanda readyForExecution.
        readyForExecution bernilai true hanya bila status MoM adalah COMPLETED.
        Bila kickoff atau MoM belum ada, respons tetap 200 dengan readyForExecution false dan field terkait null.
        Operasi hanya membaca dan tidak mengubah status proyek D-1.
        Nama peserta, lampiran MoM, bukti persetujuan, dan token tidak pernah dikirim.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7). E-3 tidak membentuk ulang ID ini.
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Proyek dikenal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReadiness'
              examples:
                siap:
                  summary: MoM selesai (examples/success.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                    kickoffId: '101'
                    momId: '201'
                    status: COMPLETED
                    completedAt: '2026-10-16T11:00:00+07:00'
                    readyForExecution: true
                belumSiap:
                  summary: MoM belum selesai (examples/success-not-ready.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                    kickoffId: '101'
                    momId: '201'
                    status: IN_PROGRESS
                    completedAt: null
                    readyForExecution: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/projects/{projectId}/planning-references:
    get:
      operationId: getPlanningReferences
      tags: [planning-references]
      summary: Baca rujukan baseline dan project plan proyek (API-K-E3-02)
      description: >
        Mengembalikan ID baseline versi disetujui terbaru dan ID project plan suatu proyek, hanya sebagai rujukan.
        Baseline berstatus DRAFT tidak pernah ditampilkan. Bila belum ada baseline disetujui atau project plan,
        respons tetap 200 dengan field terkait null. Isi matriks, estimasi jam, dan resource matrix tidak dikirim.
        Operasi hanya membaca. Konsumen dan kebutuhan datanya masih usulan E-3 sampai dikonfirmasi E-5 dan D-3.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: ID proyek kanonis milik D-1 (string UUID v7). E-3 tidak membentuk ulang ID ini.
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Proyek dikenal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningReferences'
              examples:
                lengkap:
                  summary: Baseline APPROVED dan project plan ada (examples/planning-references.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234567
                    baselineId: '301'
                    baselineVersion: 1
                    approvedAt: '2026-10-14T10:00:00+07:00'
                    planId: '401'
                    baselineItems:
                      - baselineItemId: 01924b1e-7f32-7b01-8c01-111111111111
                        name: Modul Registrasi & Rekam Medis Pasien
                        type: SCOPE
                      - baselineItemId: 01924b1e-7f32-7b01-8c01-222222222222
                        name: Integrasi Modul Farmasi & Kasir
                        type: SCOPE
                      - baselineItemId: 01924b1e-7f32-7b01-8c01-333333333333
                        name: Fase Desain & Persiapan Lingkungan
                        type: TIMELINE
                      - baselineItemId: 01924b1e-7f32-7b01-8c01-444444444444
                        name: Fase Implementasi & Pengujian UAT
                        type: TIMELINE
                    targetProgress:
                      - date: "2026-10-20"
                        progress: 15
                      - date: "2026-10-27"
                        progress: 35
                      - date: "2026-11-03"
                        progress: 60
                      - date: "2026-11-10"
                        progress: 85
                      - date: "2026-11-17"
                        progress: 100
                kosong:
                  summary: Belum ada baseline APPROVED dan project plan (examples/planning-references-empty.json)
                  value:
                    projectId: 01924b1e-7f32-7a81-9b12-45e8a1234568
                    baselineId: null
                    baselineVersion: null
                    approvedAt: null
                    planId: null
                    baselineItems: []
                    targetProgress: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Usulan: Bearer token layanan konsumen (E-4, E-5, D-3) yang divalidasi F-1. Mekanisme final perlu dikonfirmasi F-1.
        Contoh token mock saja, bukan kredensial riil.
  schemas:
    InitialAnalysisInput:
      type: object
      required: [projectNeed, projectCondition]
      properties:
        projectNeed:
          type: string
          description: Kebutuhan awal proyek (wajib diisi).
          example: Digitalisasi pengelolaan pengadaan dan persediaan barang
        projectCondition:
          type: string
          description: Kondisi awal infrastruktur dan operasional klien (wajib diisi).
          example: Pencatatan pengadaan dan stok masih manual pada spreadsheet terpisah

    InitialAnalysis:
      type: object
      required: [analysisId, projectId, projectNeed, projectCondition, status, isSaved]
      properties:
        analysisId:
          type: string
          example: '1'
        projectId:
          type: string
          description: ID proyek kanonis milik D-1 (ENT-K-E3-01).
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        projectNeed:
          type: string
          example: Digitalisasi pengelolaan pengadaan dan persediaan barang
        projectCondition:
          type: string
          example: Pencatatan pengadaan dan stok masih manual; laporan bulanan sering terlambat
        status:
          type: string
          enum: [Belum dicatat, Tersimpan]
          example: Tersimpan
        isSaved:
          type: boolean
          example: true
        createdBy:
          type: string
          nullable: true
          example: 01924b1e-7f32-7c40-8a01-9c0010100101
        createdAt:
          type: string
          nullable: true
          example: 2026-10-26 22:02:53 WIB
        updatedBy:
          type: string
          nullable: true
          example: 01924b1e-7f32-7c40-8a01-9c0010100101
        updatedAt:
          type: string
          nullable: true
          example: 2026-10-26 22:06:59 WIB

    InitialAnalysisResponse:
      type: object
      required: [message, initialAnalysis]
      properties:
        message:
          type: string
          example: Analisis awal tersimpan.
        initialAnalysis:
          $ref: '#/components/schemas/InitialAnalysis'

    ExecutionReadiness:
      type: object
      required: [projectId, kickoffId, momId, status, completedAt, readyForExecution]
      properties:
        projectId:
          type: string
          description: ID proyek kanonis D-1, sama dengan path.
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        kickoffId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID kickoff E-3 (ENT-K-E3-07), string angka. Null bila kickoff belum ada.
          example: '101'
        momId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID MoM kickoff E-3 (ENT-K-E3-08), string angka. Null bila belum ada MoM.
          example: '201'
        status:
          type: string
          nullable: true
          enum: [IN_PROGRESS, COMPLETED, null]
          description: Status MoM kickoff. Null bila belum ada MoM.
          example: COMPLETED
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu MoM selesai, ISO 8601 dengan offset WIB (+07:00), sama dengan format D-1. Terisi hanya bila status COMPLETED.
          example: '2026-10-16T11:00:00+07:00'
        readyForExecution:
          type: boolean
          description: true hanya bila status adalah COMPLETED. Selain itu false.
          example: true

    PlanningReferences:
      type: object
      required: [projectId, baselineId, baselineVersion, approvedAt, planId, baselineItems, targetProgress]
      properties:
        projectId:
          type: string
          description: ID proyek kanonis D-1, sama dengan path.
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        baselineId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID baseline versi disetujui terbaru (ENT-K-E3-02), string angka. Null bila belum ada baseline disetujui.
          example: '301'
        baselineVersion:
          type: integer
          nullable: true
          minimum: 1
          description: Nomor versi baseline tersebut. Null bila baselineId null.
          example: 1
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: Waktu baseline disetujui, ISO 8601 dengan offset WIB (+07:00), sama dengan format D-1. Null bila baselineId null.
          example: '2026-10-14T10:00:00+07:00'
        planId:
          type: string
          nullable: true
          pattern: '^[0-9]+$'
          description: ID project plan (ENT-K-E3-03), string angka. Null bila project plan belum dibuat.
          example: '401'
        baselineItems:
          type: array
          description: Daftar rincian item scope dan timeline baseline untuk acuan Change Request modul E-5.
          items:
            $ref: '#/components/schemas/BaselineItem'
        targetProgress:
          type: array
          description: Target progres kumulatif rencana berkala untuk evaluasi keterlambatan proyek modul E-5.
          items:
            $ref: '#/components/schemas/TargetProgressItem'

    BaselineItem:
      type: object
      required: [baselineItemId, name, type]
      properties:
        baselineItemId:
          type: string
          description: ID unik item baseline (string UUID v7).
          example: 01924b1e-7f32-7b01-8c01-111111111111
        name:
          type: string
          description: Nama rincian scope atau tahapan timeline baseline.
          example: Modul Registrasi & Rekam Medis Pasien
        type:
          type: string
          enum: [SCOPE, TIMELINE]
          description: Tipe kategori item baseline untuk penandaan Change Request E-5.
          example: SCOPE

    TargetProgressItem:
      type: object
      required: [date, progress]
      properties:
        date:
          type: string
          format: date
          description: Tanggal checkpoint evaluasi progres rencana (format YYYY-MM-DD).
          example: "2026-10-27"
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Target persentase penyelesaian kumulatif pada tanggal tersebut.
          example: 35

    ValidationError:
      type: object
      required: [code, message, errors]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Isian wajib belum terpenuhi.
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            projectCondition: Kondisi awal wajib diisi.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, FORBIDDEN, PROJECT_NOT_FOUND, INVALID_PROJECT_ID_FORMAT, DEPENDENCY_UNAVAILABLE, VALIDATION_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    Unauthenticated:
      description: Token tidak ada atau tidak valid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Token tidak ada atau tidak valid.}
    Forbidden:
      description: Layanan pemanggil tidak berizin pada proyek ini.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: FORBIDDEN, message: Layanan tidak berizin pada proyek ini.}
    NotFound:
      description: ID proyek tidak dikenal.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: PROJECT_NOT_FOUND, message: Proyek tidak ditemukan.}
    InvalidRequest:
      description: Format projectId salah (bukan UUID v7).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: INVALID_PROJECT_ID_FORMAT, message: Format projectId tidak valid., details: [projectId harus berformat UUID v7]}
    ValidationError:
      description: Isian wajib belum terpenuhi atau format input tidak sesuai (HTTP 422).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
          example:
            code: VALIDATION_ERROR
            message: Isian wajib belum terpenuhi.
            errors:
              projectCondition: Kondisi awal wajib diisi.
    DependencyUnavailable:
      description: Validasi ke F-1 atau D-1 gagal. E-4 tidak boleh menganggapnya sebagai izin eksekusi.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: DEPENDENCY_UNAVAILABLE, message: Validasi dependensi gagal. Coba lagi.}
